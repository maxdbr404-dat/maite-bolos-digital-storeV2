# GitHub Actions workflow para compilação e deploy no GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages com OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# Garante apenas um deploy simultâneo por vez
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Job 1: Build da aplicação React / Vite
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Instalar Dependências
        run: npm install --legacy-peer-deps

      - name: Compilar Projeto (Build Produção Vite)
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build

      - name: Enviar Artefato de Build
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # Job 2: Publicação dos artefatos no GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
